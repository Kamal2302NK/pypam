# =============================================================================
# PyPAM — Nginx Reverse Proxy Configuration
# =============================================================================
# Install: sudo cp nginx.conf /etc/nginx/sites-available/pypam
#          sudo ln -s /etc/nginx/sites-available/pypam /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream pypam_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # -----------------------------------------------------------------
    # Uncomment the next line and the ssl server block below to redirect
    # all HTTP traffic to HTTPS in production.
    # -----------------------------------------------------------------
    # return 301 https://$server_name$request_uri;

    client_max_body_size 2g;   # agent screen-recording uploads

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Frontend / API ----
    location / {
        proxy_pass http://pypam_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60;
        proxy_send_timeout    60;
        proxy_read_timeout    60;
    }

    # ---- WebSocket for SSH terminal (Native WebSocket & Socket.IO) ----
    location /ws/ {
        proxy_pass http://pypam_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    location /socket.io {
        proxy_pass http://pypam_backend/socket.io;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # ---- Static files ----
    location /static/ {
        alias /opt/pypam/static/;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # ---- Health check endpoint (optional) ----
    location /health {
        proxy_pass http://pypam_backend/api/health;
        access_log off;
    }
}

